name: Build and deploy

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened]
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      PUBLIC_SITE_URL: ${{ vars.PUBLIC_SITE_URL }}
      PUBLIC_DEVTO_URL: ${{ vars.PUBLIC_DEVTO_URL }}
      PUBLIC_PLAUSIBLE_DOMAIN: ${{ vars.PUBLIC_PLAUSIBLE_DOMAIN }}
      PUBLIC_CONTACT_EMAIL: ${{ vars.PUBLIC_CONTACT_EMAIL }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npx playwright install --with-deps chromium
      - run: npm run e2e
      # e2e builds with fixtures; rebuild clean for deployment.
      - run: npm run build
      - name: Require a public site URL before deploying
        if: github.event_name == 'push' && vars.SWA_ENABLED == 'true' && vars.PUBLIC_SITE_URL == ''
        run: |
          echo "::error::Set repository variable PUBLIC_SITE_URL (e.g. the *.azurestaticapps.net URL) so canonical links don't point at localhost."
          exit 1
      - name: Deploy to Azure Static Web Apps
        if: github.event_name == 'push' && vars.SWA_ENABLED == 'true'
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}
          action: upload
          app_location: dist
          skip_app_build: true

  # Optional second host. Turn on with repository variable PAGES_ENABLED=true and
  # Settings > Pages > Source: GitHub Actions. Rebuilt here because the base path differs from Azure.
  github-pages:
    needs: build
    if: github.event_name == 'push' && vars.PAGES_ENABLED == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    env:
      # Custom domain: set PAGES_BASE_PATH to / and PAGES_SITE_URL to the domain.
      PUBLIC_BASE_PATH: ${{ vars.PAGES_BASE_PATH || format('/{0}', github.event.repository.name) }}
      PUBLIC_SITE_URL: ${{ vars.PAGES_SITE_URL || format('https://{0}.github.io', github.repository_owner) }}
      PUBLIC_DEVTO_URL: ${{ vars.PUBLIC_DEVTO_URL }}
      PUBLIC_PLAUSIBLE_DOMAIN: ${{ vars.PUBLIC_PLAUSIBLE_DOMAIN }}
      PUBLIC_CONTACT_EMAIL: ${{ vars.PUBLIC_CONTACT_EMAIL }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - id: deploy
        uses: actions/deploy-pages@v4
